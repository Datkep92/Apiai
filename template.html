<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>Tra cứu & quản lý API model free</title>
<style>
:root{
  --bg:#0b1220;--surface:#111a2e;--card:#16203a;--text:#e8ecf4;--muted:#9aa7c2;--accent:#6ee7b7;--accent2:#60a5fa;--border:#24304f;--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#1e293b 0%,#0b1220 60%);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
header{padding:18px 20px 14px;position:sticky;top:0;z-index:10;background:rgba(11,18,32,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
header h1{font-size:20px;font-weight:700;letter-spacing:-.3px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{font-size:12px;color:var(--muted);margin-top:2px}
.controls{padding:14px 20px;display:flex;flex-direction:column;gap:10px;position:sticky;top:62px;z-index:9;background:rgba(11,18,32,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.search{position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-size:16px;outline:none;transition:border .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,231,183,.15)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.filters{display:flex;gap:8px}
.filters select{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-size:15px}
.list{padding:14px 20px 100px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;animation:fadeUp .35s ease both;transition:transform .15s ease,box-shadow .15s ease}
.card:active{transform:scale(.99)}
.card h3{font-size:16px;font-weight:600;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(96,165,250,.12);color:var(--accent2);font-size:11px}
.ep{margin:8px 0;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14px}
.ep b{color:var(--accent)}
.ep .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{padding:8px 14px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1220;font-weight:600;font-size:13px;cursor:pointer;min-height:36px;transition:transform .1s,opacity .2s}
button:active{transform:scale(.96)}
button.gray{background:var(--surface);color:var(--text);border:1px solid var(--border)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
input.key{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:16px;margin-top:8px;outline:none}
input.key:focus{border-color:var(--accent)}
.small{font-size:11px;color:var(--muted);margin-top:4px}
a{color:var(--accent2);text-decoration:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (min-width:700px){.list{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>API Model Free</h1>
  <p>Tra cứu & quản lý API key cho 273 model free</p>
</header>
<div class="controls">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" placeholder="Tìm model / provider / id...">
  </div>
  <div class="filters">
    <select id="prov"><option value="">Tất cả provider</option></select>
    <select id="sort"><option value="name">Tên A→Z</option><option value="aa">AA cao→thấp</option></select>
  </div>
</div>
<div class="list" id="list"></div>
<div class="toast" id="toast"></div>
<script>
const DATA = __DATA__;
const KEY_STORAGE = "api_keys_v1";
function loadKeys(){try{return JSON.parse(localStorage.getItem(KEY_STORAGE)||"{}")}catch(e){return {}}}
function saveKeys(k){localStorage.setItem(KEY_STORAGE,JSON.stringify(k))}
let keys = loadKeys();
function providers(){const s=new Set();DATA.forEach(m=>m.endpoints.forEach(e=>s.add(e.provider)));return [...s].sort()}
const provSel=document.getElementById("prov");
providers().forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;provSel.appendChild(o)});
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600)}
function copy(text){navigator.clipboard.writeText(text).then(()=>toast("Đã copy"))}
function aaNum(s){const m=(s||"").match(/[\d.]+/);return m?parseFloat(m[0]):0}
function render(){
  const q=document.getElementById("q").value.toLowerCase();
  const pv=provSel.value;
  const sort=document.getElementById("sort").value;
  const list=document.getElementById("list");
  list.innerHTML="";
  let arr=DATA.filter(m=>{
    if(pv && !m.endpoints.some(e=>e.provider===pv)) return false;
    if(!q) return true;
    const hay=(m.name+" "+m.dev+" "+m.endpoints.map(e=>e.id+" "+e.provider).join(" ")).toLowerCase();
    return hay.includes(q);
  });
  if(sort==="aa") arr.sort((a,b)=>aaNum(b.aa)-aaNum(a.aa)); else arr.sort((a,b)=>a.name.localeCompare(b.name));
  if(!arr.length){list.innerHTML="<div class='empty'>Không tìm thấy model phù hợp.</div>";return}
  arr.forEach((m,i)=>{
    const card=document.createElement("div");
    card.className="card";
    card.style.animationDelay=(i*0.02)+"s";
    let eps=m.endpoints.filter(e=>!pv||e.provider===pv).map(e=>{
      const key=keys[e.provider]||"";
      return `<div class="ep">
        <div><b>${e.provider}</b> <span class="badge">${e.context} ctx</span></div>
        <div class="id">${e.id}</div>
        <div class="row">
          <button onclick="copy('${e.id}')">Copy ID</button>
          <a href="${e.url}" target="_blank"><button class="ghost">Playground</button></a>
        </div>
        <input class="key" placeholder="API key cho ${e.provider}" value="${key}" data-prov="${e.provider}">
        <div class="small">Lưu trong trình duyệt</div>
      </div>`;
    }).join("");
    const caps=(m.type||"").split(";").map(x=>x.trim()).filter(Boolean);
    card.innerHTML=`<h3>${m.name}</h3>
      <div class="meta">
        <span>${m.dev||"?"}</span>
        ${m.params?`<span class="badge">${m.params}</span>`:""}
        ${m.aa?`<span class="badge">AA ${m.aa}</span>`:""}
        ${caps.map(c=>`<span class="badge">${c}</span>`).join("")}
      </div>
      ${eps}`;
    list.appendChild(card);
  });
  document.querySelectorAll("input.key").forEach(inp=>{
    inp.onchange=()=>{keys[inp.dataset.prov]=inp.value;saveKeys(keys);toast("Đã lưu key")};
  });
}
document.getElementById("q").oninput=render;
provSel.onchange=render;
document.getElementById("sort").onchange=render;
render();
</script>
</body>
</html>
